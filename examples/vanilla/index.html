<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Midad · Vanilla example</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: #eef1f5;
                color: #17243c;
                font: 16px system-ui;
            }
            header {
                position: sticky;
                top: 0;
                z-index: 20;
                background: white;
                padding: 12px 20px;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
                border-bottom: 1px solid #dbe1ea;
            }
            h1 {
                margin: 0 auto 0 0;
                font-size: 20px;
            }
            button {
                border: 1px solid #cbd5e1;
                border-radius: 6px;
                background: white;
                padding: 8px 12px;
                cursor: pointer;
            }
            button:disabled {
                opacity: 0.45;
                cursor: default;
            }
            button:focus-visible {
                outline: 3px solid #93c5fd;
            }
            #status {
                width: 100%;
                font-size: 13px;
            }
            main {
                padding: 24px 12px;
                display: grid;
                justify-content: center;
                gap: 20px;
                overflow: auto;
            }
            .page {
                position: relative;
                background: white;
                box-shadow: 0 2px 14px #17243c20;
                touch-action: pan-y;
            }
            .page canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Midad · مداد</h1>
            <button id="undo" disabled>Undo</button>
            <button id="redo" disabled>Redo</button>
            <button id="bold" disabled>Bold</button>
            <button id="pdf" disabled>Download PDF</button>
            <output id="status" role="status">Loading the editor…</output>
        </header>
        <main aria-label="Document pages"></main>
        <script type="module" src="./main.js"></script>
    </body>
</html>
