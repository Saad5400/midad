<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Midad · Custom Vue UI</title>
        <style>
            body { margin: 0; background: #eef1f5; color: #17243c; font: 16px system-ui; }
            header { position: sticky; top: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #17243c; color: white; }
            header strong { margin-inline-end: auto; }
            button { border: 0; border-radius: 6px; padding: 8px 12px; background: #fff; color: #17243c; cursor: pointer; }
            button:disabled { opacity: .5; cursor: wait; }
            .native-pages { padding: 24px; overflow: auto; }
            .native-page { box-shadow: 0 2px 12px #17243c22; }
        </style>
    </head>
    <body><div id="app"></div><script type="module" src="./main.js"></script></body>
</html>
